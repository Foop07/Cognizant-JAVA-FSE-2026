<!-- Hands-On 1, Task 2, Step 8: Welcome heading, description, stats row -->
<!-- Hands-On 2, Task 1: All four binding types demonstrated -->

<div class="home-container">
  <!-- Step 11: String interpolation -->
  <h1>{{ portalName }}</h1>
  <p class="description">Welcome to the Student Course Portal. Browse and enroll in courses, check your grades, and manage your academic profile.</p>

  <!-- Stats row with hardcoded and dynamic values -->
  <div class="stats-row">
    <div class="stat-card">
      <h3>Courses Available</h3>
      <p class="stat-value">{{ coursesAvailable }}</p>
    </div>
    <div class="stat-card">
      <h3>Enrolled</h3>
      <p class="stat-value">{{ enrolled }}</p>
    </div>
    <div class="stat-card">
      <h3>GPA</h3>
      <p class="stat-value">{{ gpa }}</p>
    </div>
  </div>

  <!-- Step 12 & 13: Property binding + Event binding -->
  <div class="action-section">
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p *ngIf="message" class="success-message">{{ message }}</p>
  </div>

  <!-- Step 14: Two-way binding with ngModel -->
  <div class="search-section">
    <label for="searchInput">Search Courses:</label>
    <input id="searchInput" [(ngModel)]="searchTerm" placeholder="Type to search...">
    <p>Searching for: {{ searchTerm }}</p>
  </div>
</div>
