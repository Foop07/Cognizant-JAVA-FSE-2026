<!-- Hands-On 5: Reactive Enrollment Form -->

<div class="form-container">
  <h2>Reactive Enrollment Form</h2>

  <div *ngIf="submitted" class="success-banner">
    Enrollment request submitted successfully!
  </div>

  <!-- Hands-On 5, Task 1, Step 50: Bind form using [formGroup] -->
  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

    <!-- Student Name -->
    <div class="form-group">
      <label for="rStudentName">Student Name</label>
      <input id="rStudentName" type="text" formControlName="studentName" placeholder="Enter your name">
      <span class="error"
        *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']">
        Name is required.
      </span>
      <span class="error"
        *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['minlength']">
        Name must be at least 3 characters.
      </span>
    </div>

    <!-- Student Email -->
    <div class="form-group">
      <label for="rStudentEmail">Email</label>
      <input id="rStudentEmail" type="email" formControlName="studentEmail" placeholder="Enter your email">
      <span class="error"
        *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['required']">
        Email is required.
      </span>
      <span class="error"
        *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['email']">
        Please enter a valid email.
      </span>
      <!-- Hands-On 5, Task 2, Step 55: Async validator error display -->
      <span class="error"
        *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
        This email is already taken.
      </span>
      <span class="info"
        *ngIf="enrollForm.get('studentEmail')?.pending">
        Checking email availability...
      </span>
    </div>

    <!-- Course ID -->
    <div class="form-group">
      <label for="rCourseId">Course ID</label>
      <input id="rCourseId" type="text" formControlName="courseId" placeholder="Enter course ID">
      <span class="error"
        *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['required']">
        Course ID is required.
      </span>
      <!-- Hands-On 5, Task 2, Step 54: Custom validator error message -->
      <span class="error"
        *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
        Course code starting with XX is not allowed.
      </span>
    </div>

    <!-- Preferred Semester -->
    <div class="form-group">
      <label for="rSemester">Preferred Semester</label>
      <select id="rSemester" formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <!-- Agree to Terms -->
    <div class="form-group checkbox-group">
      <input id="rAgreeToTerms" type="checkbox" formControlName="agreeToTerms">
      <label for="rAgreeToTerms">I agree to the terms and conditions</label>
    </div>

    <!-- Hands-On 5, Task 2, Step 56: FormArray for additional courses -->
    <div class="form-group">
      <label>Additional Courses</label>
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="additional-course">
        <input [formControl]="$any(ctrl)" placeholder="Enter additional course ID">
        <button type="button" class="btn-remove" (click)="removeCourse(i)">Remove</button>
      </div>
      <button type="button" class="btn-add" (click)="addCourse()">+ Add Another Course</button>
    </div>

    <!-- Submit -->
    <div class="form-actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    </div>
  </form>
</div>
