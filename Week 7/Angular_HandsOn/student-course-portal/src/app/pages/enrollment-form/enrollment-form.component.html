<!-- Hands-On 4: Template-Driven Enrollment Request Form -->

<div class="form-container">
  <h2>Student Enrollment Request</h2>

  <!-- Hands-On 4, Task 2, Step 46: Success message after submission -->
  <div *ngIf="submitted" class="success-banner">
    Enrollment request submitted successfully!
  </div>

  <!-- Hands-On 4, Task 1, Step 39: Template-driven form with ngForm -->
  <!-- name attribute is mandatory on every form control when using template-driven forms —
       Angular uses it as the key in form.value. -->
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

    <!-- Student Name -->
    <div class="form-group">
      <label for="studentName">Student Name</label>
      <input
        id="studentName"
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        #nameCtrl="ngModel"
        required
        minlength="3"
        placeholder="Enter your name">
      <!-- Hands-On 4, Task 2, Step 44: Contextual error messages -->
      <!-- 'touched' is true once the user has focused and left the field. Use touched for
           showing errors — not dirty — so errors show after the user interacts with a field. -->
      <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
        Name is required.
      </span>
      <span class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
        Name must be at least 3 characters.
      </span>
    </div>

    <!-- Student Email -->
    <div class="form-group">
      <label for="studentEmail">Email</label>
      <input
        id="studentEmail"
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        #emailCtrl="ngModel"
        required
        email
        placeholder="Enter your email">
      <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
        Email is required.
      </span>
      <span class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
        Please enter a valid email address.
      </span>
    </div>

    <!-- Course ID -->
    <div class="form-group">
      <label for="courseId">Course ID</label>
      <input
        id="courseId"
        type="number"
        name="courseId"
        [(ngModel)]="courseId"
        #courseCtrl="ngModel"
        required
        placeholder="Enter course ID">
      <span class="error" *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
        Course ID is required.
      </span>
    </div>

    <!-- Preferred Semester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        required>
        <option value="">Select Semester</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <!-- Agree to Terms -->
    <div class="form-group checkbox-group">
      <input
        id="agreeToTerms"
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        required>
      <label for="agreeToTerms">I agree to the terms and conditions</label>
    </div>

    <!-- Hands-On 4, Task 1, Step 41: Submit button disabled when form is invalid -->
    <div class="form-actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <!-- Hands-On 4, Task 2, Step 47: Reset button -->
      <button type="button" (click)="onReset(enrollForm)">Reset</button>
    </div>
  </form>
</div>
